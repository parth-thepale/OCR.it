<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="50%" stop-color="#0f1422" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients for Badges & Cards -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182032" />
      <stop offset="100%" stop-color="#101524" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="1" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .title { font-weight: 800; font-size: 26px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-weight: 500; font-size: 13px; fill: #38bdf8; letter-spacing: 2px; }
    .tagline { font-weight: 400; font-size: 14px; fill: #94a3b8; }
    .node-title { font-weight: 700; font-size: 12px; fill: #f1f5f9; }
    .node-sub { font-weight: 500; font-size: 10px; fill: #64748b; }
    .badge-text { font-weight: 700; font-size: 11px; letter-spacing: 0.5px; }
    .flow-arrow { stroke: #334155; stroke-width: 2; stroke-dasharray: 4,4; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Technical Grid Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Top Accent Glowing Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentLine)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="358" fill="none" stroke="#1e293b" stroke-width="1" rx="4" />

  <!-- ================= HEADER SECTION ================= -->
  <!-- Brand Title & Subtitle -->
  <g transform="translate(60, 48)">
    <text x="0" y="0" class="mono subtitle">LOCAL-AGENT-OCR // ZERO-EGRESS WASM ENGINE</text>
    <text x="0" y="32" class="mono title">OCR.it — Spatial Markdown &amp; LLM Tool Runtime</text>
    <text x="0" y="58" class="mono tagline">Deterministic Client-Side Attachment Decompression for AI Chat &amp; Autonomous Agents</text>
  </g>

  <!-- Top Right Badges -->
  <g transform="translate(730, 45)">
    <!-- Badge 1: Token Reduction -->
    <g transform="translate(0, 0)">
      <rect width="140" height="30" rx="15" fill="#0c2338" stroke="#0284c7" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#38bdf8" />
      <text x="27" y="19" class="mono badge-text" fill="#38bdf8">~88% TOKENS SAVED</text>
    </g>

    <!-- Badge 2: 0 Bytes Egress -->
    <g transform="translate(152, 0)">
      <rect width="145" height="30" rx="15" fill="#062e22" stroke="#059669" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#10b981" />
      <text x="27" y="19" class="mono badge-text" fill="#10b981">0 BYTES EGRESS</text>
    </g>

    <!-- Badge 3: Open Agent Skill -->
    <g transform="translate(309, 0)">
      <rect width="110" height="30" rx="15" fill="#241538" stroke="#9333ea" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#c084fc" />
      <text x="27" y="19" class="mono badge-text" fill="#c084fc">SKILL.MD</text>
    </g>
  </g>

  <!-- ================= PIPELINE NODES SECTION ================= -->
  <!-- Horizontal Flow Track -->
  <line x1="80" y1="210" x2="1120" y2="210" class="flow-arrow" />

  <!-- Node 1: Attachment -->
  <g transform="translate(60, 160)">
    <rect width="150" height="100" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="26" cy="28" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="23" y="32" class="mono" font-size="11" fill="#38bdf8">1</text>
    <text x="44" y="32" class="mono node-title">Attachment</text>
    <text x="16" y="58" class="mono node-sub">Image / Receipt / Code</text>
    <text x="16" y="74" class="mono node-sub">Dropzone / Clipboard</text>
    <rect x="16" y="84" width="70" height="4" rx="2" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Node 2: Canvas Normalizer -->
  <g transform="translate(245, 160)">
    <rect width="150" height="100" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="26" cy="28" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="22" y="32" class="mono" font-size="11" fill="#38bdf8">2</text>
    <text x="44" y="32" class="mono node-title">Preprocessor</text>
    <text x="16" y="58" class="mono node-sub">Luminance Detection</text>
    <text x="16" y="74" class="mono node-sub">Dark-Mode Auto-Invert</text>
    <rect x="16" y="84" width="85" height="4" rx="2" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Node 3: Web Worker (Core WASM) -->
  <g transform="translate(430, 160)">
    <rect width="160" height="100" rx="8" fill="#111c30" stroke="#0284c7" stroke-width="1.5" filter="url(#glowCyan)" />
    <circle cx="26" cy="28" r="8" fill="#0369a1" />
    <text x="22" y="32" class="mono" font-size="11" fill="#ffffff">3</text>
    <text x="44" y="32" class="mono node-title" fill="#38bdf8">WASM Worker</text>
    <text x="16" y="58" class="mono node-sub" fill="#94a3b8">Tesseract v7 (LSTM)</text>
    <text x="16" y="74" class="mono node-sub" fill="#94a3b8">BBox Hierarchy Parse</text>
    <rect x="16" y="84" width="100" height="4" rx="2" fill="#0284c7" />
  </g>

  <!-- Node 4: Spatial Y/X Clustering -->
  <g transform="translate(625, 160)">
    <rect width="160" height="100" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="26" cy="28" r="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="22" y="32" class="mono" font-size="11" fill="#10b981">4</text>
    <text x="44" y="32" class="mono node-title">Spatial Engine</text>
    <text x="16" y="58" class="mono node-sub">Median Height Clustering</text>
    <text x="16" y="74" class="mono node-sub">GFM Markdown Tables</text>
    <rect x="16" y="84" width="90" height="4" rx="2" fill="#10b981" opacity="0.6" />
  </g>

  <!-- Node 5: PII Scrubber -->
  <g transform="translate(820, 160)">
    <rect width="150" height="100" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="26" cy="28" r="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="22" y="32" class="mono" font-size="11" fill="#f59e0b">5</text>
    <text x="44" y="32" class="mono node-title">PII Scrubber</text>
    <text x="16" y="58" class="mono node-sub">API Keys &amp; Tokens</text>
    <text x="16" y="74" class="mono node-sub">Emails / Cards / Phones</text>
    <rect x="16" y="84" width="80" height="4" rx="2" fill="#f59e0b" opacity="0.6" />
  </g>

  <!-- Node 6: LLM Context / Tool Output -->
  <g transform="translate(1005, 160)">
    <rect width="145" height="100" rx="8" fill="#08231a" stroke="#10b981" stroke-width="1.5" filter="url(#glowGreen)" />
    <circle cx="26" cy="28" r="8" fill="#059669" />
    <text x="22" y="32" class="mono" font-size="11" fill="#ffffff">6</text>
    <text x="44" y="32" class="mono node-title" fill="#34d399">LLM Context</text>
    <text x="16" y="58" class="mono node-sub" fill="#a7f3d0">&lt;attachment_ocr&gt;</text>
    <text x="16" y="74" class="mono node-sub" fill="#a7f3d0">Zod / JSON Schema</text>
    <rect x="16" y="84" width="95" height="4" rx="2" fill="#10b981" />
  </g>

  <!-- Bottom Telemetry Ticker -->
  <g transform="translate(60, 310)">
    <text x="0" y="0" class="mono" font-size="11" fill="#64748b">TELEMETRY:</text>
    <text x="80" y="0" class="mono" font-size="11" fill="#38bdf8">LATENCY ~140ms</text>
    <text x="210" y="0" class="mono" font-size="11" fill="#64748b">|</text>
    <text x="230" y="0" class="mono" font-size="11" fill="#34d399">ACCURACY 98.4%</text>
    <text x="350" y="0" class="mono" font-size="11" fill="#64748b">|</text>
    <text x="370" y="0" class="mono" font-size="11" fill="#f1f5f9">VISION TILES 0 (100% BYPASS)</text>
    <text x="590" y="0" class="mono" font-size="11" fill="#64748b">|</text>
    <text x="610" y="0" class="mono" font-size="11" fill="#c084fc">AUTONOMOUS ROUTING: 'use_local_markdown'</text>
  </g>
</svg>
